<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CloudScrapers Learning Platform</title>
    <link rel="stylesheet" href="platform.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <h1>CloudScrapers</h1>
                <p style="color: var(--text-gray);">Learning Platform</p>
            </div>

            <div id="alertContainer"></div>

            <h2 style="text-align: center; margin-bottom: 1rem;">Welcome Back</h2>
            <p style="text-align: center; color: var(--text-gray); margin-bottom: 2rem;">Login to access your courses</p>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="demo@cloudscrapers.pl" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="auth-submit">Login</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Sign up here</a></p>
                <p style="margin-top: 1rem;"><a href="index.html">← Back to courses</a></p>
            </div>

            <!-- Demo Credentials -->
            <div style="margin-top: 2rem; padding: 1.5rem; background: var(--bg-light); border-radius: 10px; text-align: center;">
                <p style="color: var(--text-gray); font-size: 0.9rem; margin-bottom: 0.5rem;">Demo Credentials:</p>
                <p style="font-weight: 600; color: var(--text-dark);">Email: demo@cloudscrapers.pl</p>
                <p style="font-weight: 600; color: var(--text-dark);">Password: demo123</p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const alertContainer = document.getElementById('alertContainer');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const result = auth.login(email, password);

            if (result.success) {
                showAlert('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    // Check if there's a redirect URL
                    const params = new URLSearchParams(window.location.search);
                    const redirect = params.get('redirect') || 'index.html';
                    window.location.href = redirect;
                }, 1000);
            } else {
                showAlert(result.message, 'error');
            }
        });

        function showAlert(message, type) {
            alertContainer.innerHTML = `
                <div class="alert alert-${type}">
                    ${message}
                </div>
            `;
        }

        // Check if already logged in
        if (auth.isLoggedIn()) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
