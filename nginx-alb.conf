# CloudScrapers Nginx Configuration for AWS ALB
# This config is for when ALB handles SSL termination
# EC2 instances only need to listen on port 80

# Rate limiting zone - protects against DDoS
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name cloudscrapers.pl www.cloudscrapers.pl _;

    # Root directory
    root /var/www/cloudscrapers;
    index index.html;

    # Character encoding
    charset utf-8;

    # ========================================
    # Security Headers
    # ========================================

    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; frame-src https://www.youtube.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # HSTS - ALB should add this header, but adding here as backup
    # Only if ALB forwards X-Forwarded-Proto header
    set $hsts_header "";
    if ($http_x_forwarded_proto = 'https') {
        set $hsts_header "max-age=31536000; includeSubDomains; preload";
    }
    add_header Strict-Transport-Security $hsts_header always;

    # Hide Nginx version
    server_tokens off;

    # ========================================
    # Logging Configuration
    # ========================================
    # Note: Custom log_format must be defined in /etc/nginx/nginx.conf (http context)
    # For now, using the default 'combined' format which includes most headers

    access_log /var/log/nginx/cloudscrapers-access.log combined;
    error_log /var/log/nginx/cloudscrapers-error.log warn;

    # ========================================
    # Gzip Compression
    # ========================================

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";

    # ========================================
    # Real IP Configuration (for ALB)
    # ========================================

    # Trust ALB IP addresses
    # Update these with your ALB subnet ranges
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ========================================
    # Rate Limiting
    # ========================================

    # Apply rate limiting to entire site
    limit_req zone=general burst=20 nodelay;

    # ========================================
    # Health Check Endpoint (for ALB)
    # ========================================

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Alternative health check with more details
    location /health/detailed {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601","hostname":"$hostname"}';
    }

    # ========================================
    # Main Site (Static Files)
    # ========================================

    location / {
        try_files $uri $uri/ =404;

        # Cache control for HTML files (no cache - always fresh)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
            expires 0;
        }
    }

    # ========================================
    # Platform Directory
    # ========================================

    location /platform/ {
        alias /var/www/cloudscrapers/platform/;
        try_files $uri $uri/ /platform/index.html;

        # No cache for HTML files
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
            expires 0;
        }
    }

    # ========================================
    # Static Assets with Long Cache
    # ========================================

    # Images
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS and JavaScript
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Fonts
    location ~* \.(ttf|ttc|otf|eot|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files
    location ~* \.(mp4|webm|ogg|mp3|wav|flac|aac)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========================================
    # API Endpoint (for future backend)
    # ========================================

    location /api/ {
        # Stricter rate limiting for API
        limit_req zone=api burst=10 nodelay;

        # Proxy to backend application
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # Proxy headers - preserve ALB headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;

        # Don't cache API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # ========================================
    # Security: Deny Access to Hidden Files
    # ========================================

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup and source files
    location ~* (?:\.(?:bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
        deny all;
    }

    # ========================================
    # robots.txt and favicon.ico
    # ========================================

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # ========================================
    # Error Pages
    # ========================================

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
