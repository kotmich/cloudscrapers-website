# Custom Nginx Log Format for ALB
# ================================
# This file contains a custom log format that captures AWS ALB headers.
#
# INSTALLATION:
# Add this to your main /etc/nginx/nginx.conf file inside the 'http' block
# (BEFORE any server blocks or include statements)
#
# Example:
# http {
#     # Include this custom log format
#     log_format alb_log '$remote_addr - $remote_user [$time_local] '
#                        '"$request" $status $body_bytes_sent '
#                        '"$http_referer" "$http_user_agent" '
#                        'forwarded_for="$http_x_forwarded_for" '
#                        'forwarded_proto="$http_x_forwarded_proto" '
#                        'alb_trace="$http_x_amzn_trace_id"';
#
#     # Rest of your http configuration...
#     include /etc/nginx/conf.d/*.conf;
# }
#
# Then update nginx-alb.conf to use this format:
# Change: access_log /var/log/nginx/cloudscrapers-access.log combined;
# To:     access_log /var/log/nginx/cloudscrapers-access.log alb_log;
#
# This log format captures:
# - Client IP (can be the ALB IP if not using real_ip module correctly)
# - Remote user (for HTTP basic auth)
# - Timestamp
# - HTTP request line
# - Response status code
# - Response body size
# - Referer header
# - User agent
# - X-Forwarded-For header (contains actual client IP when behind ALB)
# - X-Forwarded-Proto header (original protocol: http or https)
# - X-Amzn-Trace-Id header (AWS ALB trace ID for request tracking)

